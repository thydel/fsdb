#  tt: |-
#    merge-all-dbs

- id: merge-all-dbs
  jq: |
    def q: "\"" as $q | $q + . + $q;
    def attach($i): $i[] | "ATTACH 'tmp/\(.).db' AS \(. | q) (READ_ONLY);";
    def select: "SELECT * FROM \(. | q).\($table)";
    def union($i): $i | map(select) | join("\nUNION ALL\n");
    [inputs] as $i | attach($i), "CREATE TABLE \($table) AS ", union($i) + ";"
  sh: |
    applis | self -nRr --arg table ${1:-MTABLE} | duckdb ${1:-tmp/tdep.db}
  tt: |-
    merge-all-dbs

- id: backup-db
  jq: |
    ($file / ".") as [ $base, $suf ] | "mv \($file) \($base)-\($date).\($suf)"
  sh: |
    file=${1:-tmp/tdep.db}
    date=$(date +%Y-%m-%d -r $file)
    self -nr --arg file $file --arg date $date

- id: hourly-db
  jq: |
    "attach '\($out)' as out;
    create table out.hours as select date_trunc('hour', to_timestamp(uts)) as start, appli, node,
    sum(size) sum, count(*) cnt, min(size) min, max(size) max, avg(size) avg
    from stat where uts > 0 and size != 0 group by 1, 2, 3 order by start"
  sh: |
    self -nr --arg out ${1:-out/tdep-hours.db}
  tt: |-
    hourly-db | duckdb tmp/tdep.db
    duckdb tmp/tdep-hours.db --csv -c 'select * from hours' > tmp/tdep-hours.csv

- id: spike
  sql: |
    select start, appli, cnt, sum as total, (max / avg) as spike from hours where spike > 10 order by spike desc
  sh: |
    <<< "$sql" duckdb ${1:-tmp/tdep-hours.db}
