- id: time-bucket-depth
  type: aggregate
  sql: |-
    SELECT time_bucket(INTERVAL '\($n) \($bucket)', date) as time,
    server,
    path[1:\($depth)] as depth,
    sum(cnt) as cnt,
    sum(size) as size,
    min(min) as min_size,
    max(max) as max_size,
    sum(size) / sum(cnt) as avg_size
    from {prev} group by all
  sh: |
    local -A opts; local args cont; opts "$@"
    start | sql --arg bucket ${args[0]:-year} --arg depth ${opts[d]:-1} --arg n ${opts[n]:-1}
  tt: |
    time-bucket | mrun

- id: n-ts-bucket
  type: constant
  sql: |-
    SELECT *
    , CAST(((max_uts - min_uts) * 1.0) / \($n) AS BIGINT) AS span
    , (uts // span) * span AS ts_bucket
    , strftime(to_timestamp(ts_bucket), '\($df)') AS bucket_time FROM {prev}
  sh: |
    eval $(args "$@")
    sql --argjson n $args --arg df ${df:-%Y-%m-%d}
  tt: |
    empty | n-ts-bucket 20

- id: ts_bucket
  type: constant
  sql: |-
    SELECT *
    , (uts // \($span)) * \($span) AS ts_bucket
    , strftime(to_timestamp(ts_bucket), '\($df)') AS bucket_time FROM {prev}
  sh: |
    eval $(args "$@")
    sql --arg span $(time-slice ${args[@]}) --arg df ${df:-%Y-%m-%d}
  tt: |
    empty | ts_bucket month

- id: where
  type: filter
  sql: |-
    SELECT * FROM {prev} WHERE \($ARGS.positional | join(" "))
  sh: |
    sql --args "$@"
  tt: |
    empty | where uts != 0

- id: is
  type: filter
  sh: |
    : ${2:?}; where $1 == "'$2'"
  tt: |
    empty | is appli mailmerge

- id: like
  type: filter
  sh: |
    : ${2:?}; where $1 like "'$2'"
  tt: |
    empty | is appli mailmerge

################ pipe

- id: sum-server
  sh: |
    start | sum server cnt,size | human cnt size | order size
  tt: |
    sum-server | mrun -box

- id: sum-server-path
  sh: |
    start | sum server,path[1:${1:-1}] cnt,size | human cnt size | order size | limit
  tt: |
    sum-server-path | mrun | sed 3d
    sum-server-path 2 | limit | mrun | sed 3d
